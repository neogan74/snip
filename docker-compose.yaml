services:
  app:
    build: .
    container_name: snippetbox
    ports:
      - "4001:4001"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SNIP_DB_DSN: "snipuser:snippassword@tcp(mysql:3306)/snipdb?parseTime=true"
    volumes:
      - ./cmd/web/tls:/app/tls:ro
    command: ["-addr", ":4001"]

  mysql:
    image: mysql:8.0.22
    platform: linux/amd64
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: snipdb
      MYSQL_USER: snipuser
      MYSQL_PASSWORD: snippassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: userpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis_db
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


volumes:
  mysql_data:
  postgres_data:
  redis_data:
