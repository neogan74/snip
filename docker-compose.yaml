version: '3.8'
services:
  app:
    build: .
    container_name: snippetbox
    ports:
      - "4000:4000"
    depends_on:
      - mysql
    environment:
      # Пример переменных окружения для подключения к БД
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306

  mysql:
    image: mysql:8.0.22
    platform: linux/amd64
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: snipdb
      MYSQL_USER: snipuser
      MYSQL_PASSWORD: snippassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  postgres:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: userpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis_db
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


volumes:
  mysql_data:
  postgres_data:
  redis_data:
